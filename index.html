      var zTimer = null, gest = null, lastTap = null, suppressUntil = 0;

      function zRect(){ return map.getBoundingClientRect(); }
      function zClamp(){
        var r = zRect();

      function zApply(){
        map.style.setProperty('--gs-t', 'translate3d(' + zx + 'px,' + zy + 'px,0) scale(' + zs + ')');

        if (zTimer) clearTimeout(zTimer);
        var reduce = mq('(prefers-reduced-motion: reduce)');
        root.classList.toggle('is-zoom-anim', !reduce);
        zs = s; zx = x; zy = y;
        zClamp(); zApply();
        var ms = reduce ? 0 : ZOOM.ms;
        zTimer = setTimeout(function(){ zTimer = null; root.classList.remove('is-zoom-anim'); }, ms);
        return ms;
      }
      /* 확대돼 있으면 부드럽게 풀고, 걸리는 시간(ms)을 돌려줍니다 */
      function resetZoom(){
        if (zs <= 1.001) return 0;
        return zAnimate(1, 0, 0);
      }

      function tp(t, r){ return { x:t.clientX - r.left, y:t.clientY - r.top }; }
      function dist(a, b){ return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }

      if (!EDIT){
        map.addEventListener('touchstart', function(e){
          var r = zRect();
          if (e.touches.length === 2){
            var a = tp(e.touches[0], r), b = tp(e.touches[1], r);
            var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
            gest = { mode:'pinch', d0:Math.max(dist(a, b), 1), s0:zs,
                     px:(mx - zx) / zs, py:(my - zy) / zs, moved:true };
            e.preventDefault();          /* 브라우저 전체 확대 대신 배치도만 확대 */
          } else if (e.touches.length === 1){
            var p = tp(e.touches[0], r);
            gest = { mode: zs > 1.001 ? 'pan' : 'tap', sx:p.x, sy:p.y, x0:zx, y0:zy, moved:false };
          }
        }, { passive:false });

        map.addEventListener('touchmove', function(e){
          if (!gest) return;
          var r = zRect();
          if (gest.mode === 'pinch' && e.touches.length >= 2){
            e.preventDefault();
            var a = tp(e.touches[0], r), b = tp(e.touches[1], r);
            var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
            zs = clamp(gest.s0 * dist(a, b) / gest.d0, 1, ZOOM.max);
            zx = mx - gest.px * zs;
            zy = my - gest.py * zs;
            zClamp(); zApply();
          } else if (gest.mode === 'pan' && e.touches.length === 1){
            e.preventDefault();
            var p = tp(e.touches[0], r);
            var dx = p.x - gest.sx, dy = p.y - gest.sy;
            if (!gest.moved && Math.abs(dx) + Math.abs(dy) > 6) gest.moved = true;
            if (gest.moved){ zx = gest.x0 + dx; zy = gest.y0 + dy; zClamp(); zApply(); }
          } else if (gest.mode === 'tap' && e.touches.length === 1){
            var q = tp(e.touches[0], r);
            if (Math.abs(q.x - gest.sx) + Math.abs(q.y - gest.sy) > 10) gest.moved = true;
          }
        }, { passive:false });

        map.addEventListener('touchend', function(e){
          if (!gest) return;
          var r = zRect();
          if (gest.mode === 'pinch'){
            suppressUntil = Date.now() + 400;
            if (e.touches.length === 1){
              /* 한 손가락을 떼면 남은 손가락으로 이어서 이동 */
              var p = tp(e.touches[0], r);
              gest = { mode: zs > 1.001 ? 'pan' : 'none', sx:p.x, sy:p.y, x0:zx, y0:zy, moved:true };
            } else if (!e.touches.length){
              if (zs < 1.08) zAnimate(1, 0, 0);   /* 거의 원래 크기면 딱 맞춰 되돌림 */
              gest = null;
            }
            return;
          }
          if (e.touches.length) return;
          if (gest.moved){ suppressUntil = Date.now() + 400; gest = null; return; }

          /* 빈 곳 두 번 탭 → 확대 ↔ 원래대로 */
          var t = tp(e.changedTouches[0], r);
          var onHs = e.target.closest && e.target.closest('.guide-section__hs');
          var now = Date.now();
          if (!onHs && lastTap && now - lastTap.t < 320 &&
              Math.abs(t.x - lastTap.x) + Math.abs(t.y - lastTap.y) < 30){
            lastTap = null;
            e.preventDefault();
            if (zs > 1.001) zAnimate(1, 0, 0);
            else {
              /* 탭한 지점(현재 이미지상의 점)을 기준으로 확대 */
              var cx = (t.x - zx) / zs, cy = (t.y - zy) / zs, s = ZOOM.dbl;
              zAnimate(s, t.x - cx * s, t.y - cy * s);
            }
          } else {
            lastTap = onHs ? null : { t:now, x:t.x, y:t.y };
          }
          gest = null;
        }, { passive:false });

        map.addEventListener('touchcancel', function(){
          gest = null;
          if (zs > 1.001 && zs < 1.08) zAnimate(1, 0, 0);
        });

        /* iOS 사파리 — 배치도 위 핀치가 페이지 확대로 번지지 않게 */
        map.addEventListener('gesturestart',  function(e){ e.preventDefault(); });
        map.addEventListener('gesturechange', function(e){ e.preventDefault(); });

        /* 화면 폭이 바뀌면(회전 등) 확대 초기화 — 주소창 높이 변화는 무시 */
        window.addEventListener('resize', function(){
          if (window.innerWidth === zW) return;
          zW = window.innerWidth;
          if (zTimer){ clearTimeout(zTimer); zTimer = null; root.classList.remove('is-zoom-anim'); }
          zs = 1; zx = 0; zy = 0; zApply();
        });
      }

      layer.addEventListener('click', function(e){
        if (EDIT && !TEST) return;
        var btn = e.target.closest('.guide-section__hs');
        if (!btn || !layer.contains(btn)) return;
        /* 핀치·이동 직후 손가락을 뗀 자리가 눌린 것으로 처리되지 않게 */
        if (!EDIT && Date.now() < suppressUntil){ e.preventDefault(); return; }
        tap(btn);
        var code = btn.getAttribute('data-code');
        var isZ = btn.getAttribute('data-type') === 'zone';
        function act(){
          var ok = isZ ? goZone(code) : openFacility(code);
          if (EDIT && !ok && window.gsEditMsg) window.gsEditMsg('⚠ ' + code + ' — 조경 가이드 섹션에서 찾을 수 없습니다');
        }
        /* 확대 상태면 먼저 부드럽게 축소 → 거의 끝날 즈음 팝업 · 스크롤 */
        var wait = resetZoom();
        if (wait) setTimeout(act, Math.round(wait * 0.7)); else act();
      });

      /* ── 등장 + 1회 힌트 ─────────────────────────────────── */
      function reveal(){
        root.classList.add('is-visible');
        if (EDIT || mq('(prefers-reduced-motion: reduce)')) return;
        setTimeout(function(){
          root.classList.add('is-hint');
          setTimeout(function(){ root.classList.remove('is-hint'); }, 2700);
        }, 900);
      }
      if (EDIT || !('IntersectionObserver' in window)){
        reveal();
      } else {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting){ reveal(); io.unobserve(entry.target); }
          });
        }, { threshold: 0.15 });
        io.observe(root);
      }

      /* 조경 가이드 섹션이 이 섹션보다 뒤에 있으면, 페이지 로드 후 이름·색을 다시 맞춥니다 */
      if (document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', function(){ if (!EDIT) render(); });
      }

      if (!EDIT) return;

      /* ==========================================================
         편집 모드 — ?hs=edit 일 때만 동작합니다 (방문자에게는 보이지 않음)
         ========================================================== */
      root.classList.add('is-edit');

      var BASE = JSON.stringify(HOTSPOTS);
      var KEY = 'gs-hotspots:' + location.pathname;
      var sel = -1, drag = null, loaded = false;

      try{
        var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (saved && saved.base === BASE && Array.isArray(saved.list)){ HOTSPOTS = saved.list; loaded = true; }
      }catch(e){}
      function save(){
        try{ localStorage.setItem(KEY, JSON.stringify({ base:BASE, list:HOTSPOTS })); }catch(e){}
      }

      var ed = document.createElement('div');
      ed.className = 'gse';
      ed.setAttribute('data-gs-editor', '');
      ed.innerHTML =
        '<div class="gse-head"><b>배치도 좌표 편집</b><span data-e-count></span><button type="button" data-e-min>접기</button></div>' +
        '<p class="gse-help">드래그 = 이동 · 노란 점 = 크기 · 방향키 = 0.1% (Shift 1%) · Esc = 선택 해제</p>' +
        '<p class="gse-link" data-e-link></p>' +
        '<div class="gse-row">' +
          '<button type="button" data-e-mode="edit" class="is-on">편집</button>' +
          '<button type="button" data-e-mode="test">테스트 (클릭 연동)</button>' +
        '</div>' +
        '<div class="gse-row">' +
          '<button type="button" data-e-view="pc" class="is-on">PC 보기</button>' +
          '<button type="button" data-e-view="mo">모바일 375 보기</button>' +
        '</div>' +
        '<div class="gse-box">' +
          '<label class="gse-f"><span>추가할 항목 (조경 가이드 섹션 목록)</span></label>' +
          '<div class="gse-add"><select data-e-addsel></select><button type="button" data-e-add>+ 추가</button></div>' +
          '<div class="gse-row"><button type="button" data-e-addall>미배치 항목 모두 추가</button></div>' +
        '</div>' +
        '<div class="gse-box">' +
          '<label class="gse-f"><span>선택</span><select data-e-pick></select></label>' +
          '<div data-e-fields hidden>' +
            '<div class="gse-grid">' +
              '<label class="gse-f" style="grid-column:1/-1"><span>연결 대상</span><select data-k="code"></select></label>' +
              '<label class="gse-f" style="grid-column:1/-1"><span>표시 이름 (연결 대상 이름이 우선)</span><input data-k="name" type="text"></label>' +
              '<label class="gse-f"><span>X %</span><input data-k="x" type="number" step="0.1" min="0" max="100"></label>' +
              '<label class="gse-f"><span>Y %</span><input data-k="y" type="number" step="0.1" min="0" max="100"></label>' +
              '<label class="gse-f" data-for="zone"><span>너비 %</span><input data-k="w" type="number" step="0.1" min="1" max="100"></label>' +
              '<label class="gse-f" data-for="zone"><span>높이 %</span><input data-k="h" type="number" step="0.1" min="1" max="100"></label>' +
              '<label class="gse-f" data-for="zone"><span>모양</span><select data-k="shape"><option value="rect">사각</option><option value="ellipse">타원</option></select></label>' +
              '<label class="gse-f" data-for="item"><span>지름 %</span><input data-k="d" type="number" step="0.1" min="0.5" max="20"></label>' +
            '</div>' +
            '<div class="gse-row">' +
              '<button type="button" data-e-dup>복제</button>' +
              '<button type="button" data-e-try>이 항목 테스트</button>' +
              '<button type="button" class="is-danger" data-e-del>삭제</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="gse-box">' +
          '<div class="gse-row"><button type="button" class="is-main" data-e-copy="all">전체 코드 복사</button></div>' +
          '<div class="gse-row">' +
            '<button type="button" data-e-copy="data">좌표만 복사</button>' +
            '<button type="button" data-e-reset>코드 값으로 되돌리기</button>' +
          '</div>' +
          '<p class="gse-msg" data-e-msg></p>' +
          '<textarea data-e-out readonly hidden></textarea>' +
        '</div>';
      root.appendChild(ed);

      var ePick   = ed.querySelector('[data-e-pick]');
      var eFields = ed.querySelector('[data-e-fields]');
      var eCode   = eFields.querySelector('[data-k="code"]');
      var eAddSel = ed.querySelector('[data-e-addsel]');
      var eLink   = ed.querySelector('[data-e-link]');
      var eMsg    = ed.querySelector('[data-e-msg]');
      var eOut    = ed.querySelector('[data-e-out]');
      var eCount  = ed.querySelector('[data-e-count]');
      var msgT = null;

      function msg(t){
        eMsg.textContent = t;
        if (msgT) clearTimeout(msgT);
        msgT = setTimeout(function(){ eMsg.textContent = ''; }, 4500);
      }
      window.gsEditMsg = msg;
      if (loaded) msg('저장된 편집본을 불러왔습니다');

      /* ── 목록 · 연동 상태 ────────────────────────────────── */
      function placedCount(code){
        var n = 0;
        HOTSPOTS.forEach(function(h){ if (up(h.code) === up(code)) n++; });
        return n;
      }

      function catalogOrFallback(){
        var c = catalog();
        if (!c.zones.length && !c.items.length){
          /* 섹션이 없는 페이지에서 편집할 때 — 현재 좌표 + 기본 목록 */
          var seen = {};
          HOTSPOTS.forEach(function(h){
            if (seen[up(h.code)]) return;
            seen[up(h.code)] = 1;
            (isZone(h) ? c.zones : c.items).push({ type:h.type, code:h.code, name:h.name });
          });
          if (!seen.ETC) c.zones.push({ type:'zone', code:'etc', name:'그 외 단지 내' });
        }
        return c;
      }

      function optionsHTML(c, current, showCount){
        function opt(it){
          var n = placedCount(it.code);
          var tag = showCount ? (n ? ' · 배치됨 ' + n : ' · 미배치') : '';
          return '<option value="' + esc(it.type + '|' + it.code) + '"' +
                 (current && up(current) === up(it.code) ? ' selected' : '') + '>' +
                 esc(it.code + ' ' + it.name + tag) + '</option>';
        }
        var plays = c.items.filter(function(i){ return i.cat !== 'relax' && !/^r/i.test(i.code); });
        var rest  = c.items.filter(function(i){ return plays.indexOf(i) < 0; });
        return '<optgroup label="구역 → 코스로 스크롤">' + c.zones.map(opt).join('') + '</optgroup>' +
               (plays.length ? '<optgroup label="시설 P → 팝업">' + plays.map(opt).join('') + '</optgroup>' : '') +
               (rest.length  ? '<optgroup label="시설 R → 팝업">' + rest.map(opt).join('') + '</optgroup>' : '');
      }

      function firstUnplaced(c){
        var all = c.zones.concat(c.items);
        for (var i = 0; i < all.length; i++) if (!placedCount(all[i].code)) return all[i];
        return null;
      }

      function renderLink(){
        var c = catalog();
        if (!c.linked){
          eLink.className = 'gse-link is-bad';
          eLink.textContent = '✗ #' + GUIDE_ID + ' 섹션이 이 페이지에 없습니다 — 같은 페이지에 두어야 연동됩니다';
          return;
        }
        var miss = [];
        HOTSPOTS.forEach(function(h){ if (!lookup(h.code) && miss.indexOf(h.code) < 0) miss.push(h.code); });
        var un = c.zones.concat(c.items).filter(function(it){ return !placedCount(it.code); }).length;
        eLink.className = 'gse-link ' + (miss.length ? 'is-bad' : 'is-ok');
        eLink.textContent = (miss.length ? '⚠ 연결 안 됨: ' + miss.join(', ') : '✓ 조경 가이드 연동됨') +
          ' · 구역 ' + c.zones.length + ' · 시설 ' + c.items.length + ' · 미배치 ' + un;
      }

      function renderAddSel(){
        var c = catalogOrFallback();
        var first = firstUnplaced(c);
        eAddSel.innerHTML = optionsHTML(c, first ? first.code : null, true);
      }

      function renderPick(){
        ePick.innerHTML = '<option value="-1">— 배치도에서 누르거나 여기서 선택 —</option>' +
          HOTSPOTS.map(function(h, i){
            var bad = guide() && !lookup(h.code) ? ' ⚠' : '';
            return '<option value="' + i + '">' + (isZone(h) ? '[구역] ' : '[시설] ') + esc(h.code + ' ' + nameOf(h)) + bad + '</option>';
          }).join('');
        ePick.value = String(sel);
        eCount.textContent = HOTSPOTS.length + '개';
      }

      function elOf(i){ return layer.querySelector('.guide-section__hs[data-i="' + i + '"]'); }

      function select(i){
        sel = (i >= 0 && i < HOTSPOTS.length) ? i : -1;
        each(layer.querySelectorAll('.guide-section__hs'), function(b){
          b.classList.toggle('is-sel', Number(b.getAttribute('data-i')) === sel);
        });
        ePick.value = String(sel);
        fillFields();
      }

      function fillFields(){
        var h = HOTSPOTS[sel];
        eFields.hidden = !h;
        if (!h) return;
        var kind = isZone(h) ? 'zone' : 'item';
        each(eFields.querySelectorAll('[data-for]'), function(r){
          r.hidden = r.getAttribute('data-for') !== kind;
        });
        if (document.activeElement !== eCode){
          var c = catalogOrFallback();
          var html = optionsHTML(c, h.code, false);
          if (!lookup(h.code)){
            html = '<option value="' + esc(h.type + '|' + h.code) + '" selected>⚠ ' + esc(h.code + ' ' + (h.name || '')) + ' (연결 안 됨)</option>' + html;
          }
          eCode.innerHTML = html;
        }
        each(eFields.querySelectorAll('[data-k]'), function(inp){
          if (inp === eCode || document.activeElement === inp) return;
          var k = inp.getAttribute('data-k'), v = h[k];
          if (k === 'd' && v == null) v = POINT_D;
          if (k === 'shape') v = h.shape || 'rect';
          if (k === 'name') v = nameOf(h);
          inp.value = (v == null) ? '' : v;
        });
      }

      function refresh(){ render(); renderPick(); renderAddSel(); renderLink(); select(sel); }
      function applyOne(i){
        var el = elOf(i);
        if (el) el.setAttribute('style', vars(HOTSPOTS[i]));
      }

      /* ── 항목 만들기 · 타입 변환 ─────────────────────────── */
      function make(type, code, name, cx, cy){
        if (type === 'zone'){
          return { type:'zone', code:code, name:name,
                   x:r1(clamp(cx - 8, 0, 84)), y:r1(clamp(cy - 6, 0, 88)), w:16, h:12 };
        }
        return { type:'item', code:code, name:name, x:r1(cx), y:r1(cy) };
      }
      function center(h){
        return isZone(h) ? { x:h.x + h.w / 2, y:h.y + h.h / 2 } : { x:h.x, y:h.y };
      }
      function parseVal(v){
        var p = String(v).split('|');
        var type = p.shift(), code = p.join('|');
        var hit = lookup(code);
        return { type:type, code:code, name:hit ? hit.name : code };
      }

      /* 추가할 때 겹치지 않도록 화면 가운데 근처에 조금씩 비켜 놓습니다 */
      var addN = 0;
      function nextSpot(){
        var k = addN++ % 25;
        return { x: 30 + (k % 5) * 10, y: 30 + Math.floor(k / 5) * 10 };
      }

      function addOne(val){
        var v = parseVal(val), p = nextSpot();
        HOTSPOTS.push(make(v.type, v.code, v.name, p.x, p.y));
        sel = HOTSPOTS.length - 1;
        refresh(); save();
        msg((v.type === 'zone' ? '구역 ' : '시설 ') + v.code + ' ' + v.name + ' 추가됨 — 드래그로 옮기세요');
      }

      function addAll(){
        var c = catalogOrFallback();
        var list = c.zones.concat(c.items).filter(function(it){ return !placedCount(it.code); });
        if (!list.length){ msg('미배치 항목이 없습니다'); return; }
        addN = 0;
        list.forEach(function(it){
          var p = nextSpot();
          HOTSPOTS.push(make(it.type, it.code, it.name, p.x, p.y));
        });
        sel = -1;
        refresh(); save();
        msg(list.length + '개 추가됨 — 가운데 모인 항목을 제자리로 옮기세요');
      }

      refresh();

      /* ── 드래그 이동 · 크기 조절 ─────────────────────────── */
      layer.addEventListener('pointerdown', function(e){
        if (TEST || ed.contains(e.target)) return;
        var btn = e.target.closest('.guide-section__hs');
        if (!btn){ select(-1); return; }
        e.preventDefault();
        var i = Number(btn.getAttribute('data-i'));
        select(i);
        var hd = e.target.closest('.guide-section__hd');
        var r = map.getBoundingClientRect();
        drag = {
          i: i, mode: hd ? hd.getAttribute('data-h') : 'move',
          sx: e.clientX, sy: e.clientY, rw: r.width, rh: r.height,
          o: JSON.parse(JSON.stringify(HOTSPOTS[i]))
        };
        try{ btn.setPointerCapture(e.pointerId); }catch(x){}
      });

      layer.addEventListener('pointermove', function(e){
        if (!drag) return;
        var h = HOTSPOTS[drag.i], o = drag.o;
        var dx = (e.clientX - drag.sx) / drag.rw * 100;
        var dy = (e.clientY - drag.sy) / drag.rh * 100;

        if (drag.mode === 'move'){
          if (isZone(h)){
            h.x = r1(clamp(o.x + dx, 0, 100 - o.w));
            h.y = r1(clamp(o.y + dy, 0, 100 - o.h));
          } else {
            h.x = r1(clamp(o.x + dx, 0, 100));
            h.y = r1(clamp(o.y + dy, 0, 100));
          }
        } else if (drag.mode === 'r'){
          var d0 = o.d != null ? o.d : POINT_D;
          h.d = r1(clamp(d0 + dx * 2, 0.5, 20));
        } else {
          var L = o.x, T = o.y, R = o.x + o.w, B = o.y + o.h, m = drag.mode;
          if (m.indexOf('w') > -1) L = clamp(Math.min(L + dx, R - 1), 0, 100);
          if (m.indexOf('e') > -1) R = clamp(Math.max(R + dx, L + 1), 0, 100);
          if (m.indexOf('n') > -1) T = clamp(Math.min(T + dy, B - 1), 0, 100);
          if (m.indexOf('s') > -1) B = clamp(Math.max(B + dy, T + 1), 0, 100);
          h.x = r1(L); h.y = r1(T); h.w = r1(R - L); h.h = r1(B - T);
        }
        applyOne(drag.i);
        fillFields();
      });

      function endDrag(){ if (drag){ drag = null; save(); } }
      layer.addEventListener('pointerup', endDrag);
      layer.addEventListener('pointercancel', endDrag);

      /* 방향키 미세 이동 */
      document.addEventListener('keydown', function(e){
        if (TEST || sel < 0) return;
        var g = guide(), m = g && g.querySelector('#slg-modal');
        if (m && m.open) return;
        var t = e.target;
        if (t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
        if (e.key === 'Escape'){ select(-1); return; }
        var step = e.shiftKey ? 1 : 0.1, dx = 0, dy = 0;
        if (e.key === 'ArrowLeft') dx = -step;
        else if (e.key === 'ArrowRight') dx = step;
        else if (e.key === 'ArrowUp') dy = -step;
        else if (e.key === 'ArrowDown') dy = step;
        else return;
        e.preventDefault();
        var h = HOTSPOTS[sel];
        var maxX = isZone(h) ? 100 - h.w : 100, maxY = isZone(h) ? 100 - h.h : 100;
        h.x = r1(clamp(h.x + dx, 0, maxX));
        h.y = r1(clamp(h.y + dy, 0, maxY));
        applyOne(sel); fillFields(); save();
      });

      /* ── 패널 입력 ───────────────────────────────────────── */
      ePick.addEventListener('change', function(){ select(Number(ePick.value)); });

      /* 연결 대상 변경 — 구역↔시설 바뀌면 같은 중심점 기준으로 형태도 바꿉니다 */
      eCode.addEventListener('change', function(){
        var h = HOTSPOTS[sel];
        if (!h) return;
        var v = parseVal(eCode.value);
        if (v.type !== h.type){
          var c = center(h);
          var n = make(v.type, v.code, v.name, c.x, c.y);
          HOTSPOTS[sel] = n;
        } else {
          h.code = v.code;
          h.name = v.name;
        }
        eCode.blur();
        refresh(); save();
      });

      eFields.addEventListener('input', function(e){
        var inp = e.target.closest('[data-k]');
        var h = HOTSPOTS[sel];
        if (!inp || !h || inp === eCode) return;
        var k = inp.getAttribute('data-k');
        if (k === 'name'){
          h.name = inp.value;
          render(); renderPick(); select(sel);
        } else if (k === 'shape'){
          if (inp.value === 'ellipse') h.shape = 'ellipse'; else delete h.shape;
          render(); select(sel);
        } else {
          var v = parseFloat(inp.value);
          if (!isFinite(v)) return;
          h[k] = r1(clamp(v, k === 'd' ? 0.5 : 0, 100));
          applyOne(sel);
        }
        save();
      });

      function setMode(test){
        TEST = test;
        root.classList.toggle('is-test', test);
        each(ed.querySelectorAll('[data-e-mode]'), function(x){
          x.classList.toggle('is-on', (x.getAttribute('data-e-mode') === 'test') === test);
        });
        if (test){ select(-1); msg('테스트 — 배치도를 눌러 스크롤 · 팝업을 확인하세요'); }
      }

      ed.addEventListener('click', function(e){
        var b = e.target.closest('button');
        if (!b) return;

        if (b.hasAttribute('data-e-min')){
          var min = ed.classList.toggle('is-min');
          b.textContent = min ? '펼치기' : '접기';
          return;
        }
        if (b.hasAttribute('data-e-mode')){ setMode(b.getAttribute('data-e-mode') === 'test'); return; }
        if (b.hasAttribute('data-e-view')){
          var mo = b.getAttribute('data-e-view') === 'mo';
          map.style.maxWidth = mo ? '375px' : '';
          each(ed.querySelectorAll('[data-e-view]'), function(x){ x.classList.toggle('is-on', x === b); });
          return;
        }
        if (b.hasAttribute('data-e-add')){
          if (!eAddSel.value){ msg('추가할 항목이 없습니다'); return; }
          setMode(false);
          addOne(eAddSel.value);
          return;
        }
        if (b.hasAttribute('data-e-addall')){ setMode(false); addAll(); return; }
        if (b.hasAttribute('data-e-dup')){
          if (sel < 0) return;
          var cp = JSON.parse(JSON.stringify(HOTSPOTS[sel]));
          cp.x = r1(clamp(cp.x + 3, 0, isZone(cp) ? 100 - cp.w : 100));
          cp.y = r1(clamp(cp.y + 3, 0, isZone(cp) ? 100 - cp.h : 100));
          HOTSPOTS.push(cp);
          sel = HOTSPOTS.length - 1;
          refresh(); save();
          msg(cp.code + ' 복제됨 — 같은 시설이 여러 곳일 때 사용하세요');
          return;
        }
        if (b.hasAttribute('data-e-try')){
          var t = HOTSPOTS[sel];
          if (!t) return;
          var ok = isZone(t) ? goZone(t.code) : openFacility(t.code);
          if (!ok) msg('⚠ ' + t.code + ' — 조경 가이드 섹션에서 찾을 수 없습니다');
          return;
        }
        if (b.hasAttribute('data-e-del')){
          if (sel < 0) return;
          var h = HOTSPOTS[sel];
          if (!window.confirm(h.code + ' ' + nameOf(h) + ' 항목을 삭제할까요?')) return;
          HOTSPOTS.splice(sel, 1);
          sel = -1;
          refresh(); save();
          return;
        }
        if (b.hasAttribute('data-e-reset')){
          if (!window.confirm('편집한 내용을 버리고 코드에 적힌 좌표로 되돌릴까요?')) return;
          HOTSPOTS = JSON.parse(BASE);
          sel = -1;
          try{ localStorage.removeItem(KEY); }catch(x){}
          refresh();
          msg('코드 값으로 되돌렸습니다');
          return;
        }
        if (b.hasAttribute('data-e-copy')){
          var all = b.getAttribute('data-e-copy') === 'all';
          copy(all ? fullCode() : 'var HOTSPOTS = ' + serialize() + ';',
               all ? '전체 코드 복사됨 — 기존 guide-section 섹션을 통째로 교체하세요'
                   : '좌표 배열 복사됨 — 코드의 var HOTSPOTS 부분을 교체하세요');
        }
      });

      /* 조경 가이드 섹션이 뒤늦게 그려져도 목록이 따라오도록 */
      window.addEventListener('load', refresh);
      eAddSel.addEventListener('focus', renderAddSel);

      /* ── 코드 생성 ───────────────────────────────────────── */
      function q(s){ return "'" + String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'"; }

      function serialize(){
        var list = HOTSPOTS.filter(isZone).concat(HOTSPOTS.filter(function(h){ return !isZone(h); }));
        return '[\n' + list.map(function(h){
          var s = '        { type:' + q(h.type) + ', code:' + q(h.code) + ', name:' + q(nameOf(h)) +
                  ', x:' + r1(h.x) + ', y:' + r1(h.y);
          if (isZone(h)){
            s += ', w:' + r1(h.w) + ', h:' + r1(h.h);
            if (h.shape === 'ellipse') s += ", shape:'ellipse'";
          } else if (h.d != null && r1(h.d) !== POINT_D){
            s += ', d:' + r1(h.d);
          }
          return s + ' }';
        }).join(',\n') + '\n      ]';
      }

      /* 현재 섹션을 복제해 편집 흔적을 지우고, 좌표 블록만 새 값으로 바꿉니다 */
      function fullCode(){
        var c = root.cloneNode(true);
        c.removeAttribute('data-inited');
        c.removeAttribute('class');
        var x = c.querySelector('[data-gs-editor]');
        if (x) x.parentNode.removeChild(x);
        var ly = c.querySelector('[data-gs-layer]');
        if (ly) ly.innerHTML = '';
        var mp = c.querySelector('[data-gs-map]');
        if (mp) mp.removeAttribute('style');

        var sc = c.querySelector('script');
        var txt = sc.textContent;
        var S = '/*@HS' + '-START*/', E = '/*@HS' + '-END*/';
        var a = txt.indexOf(S), b = a > -1 ? txt.indexOf(E, a) : -1;
        if (a > -1 && b > -1){
          txt = txt.slice(0, a + S.length) +
                '\n      var HOTSPOTS = ' + serialize() + ';\n      ' +
                txt.slice(b);
        }
        sc.textContent = txt;
        return c.outerHTML;
      }

      function copy(text, okMsg){
        eOut.hidden = true;
        function fallback(){
          eOut.value = text;
          eOut.hidden = false;
          eOut.focus();
          eOut.select();
          var ok = false;
          try{ ok = document.execCommand('copy'); }catch(x){}
          if (ok){ eOut.hidden = true; msg(okMsg); }
          else msg('자동 복사가 막혔습니다 — 아래 상자 전체를 선택해 복사하세요');
        }
        if (navigator.clipboard && window.isSecureContext){
          navigator.clipboard.writeText(text).then(function(){ msg(okMsg); }).catch(fallback);
        } else fallback();
      }
    })();
  </script>
</section>

  container-type:inline-size;

  box-sizing:border-box;
  display:block;

    radial-gradient(120% 60% at 50% -10%, rgba(198,169,107,.07), transparent 62%),

  font-family:"Pretendard","Pretendard Variable","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;

  /* 가로로 삐져나오는 요소만 잘라냅니다.
     clip 은 스크롤 영역을 만들지 않으므로 세로 드래그에 끼어들지 않습니다

#seosin-landscape-guide .slg-chip.is-on::after{ transform:scaleX(1); }
#seosin-landscape-guide .slg-chip--play.is-on{ color:var(--slg-play); }
#seosin-landscape-guide .slg-chip--relax.is-on{ color:var(--slg-relax); }

/* 구역 마크 — 배치도의 빨간 원 */
#seosin-landscape-guide .slg-mark{
  display:grid; place-items:center; width:1.75em; height:1.75em; border-radius:50%;
  border:1px solid rgba(195,34,44,.75); color:var(--slg-zone-ink);

  transition:border-color .25s ease, background-color .25s ease, color .25s ease;

  border-color:#fff; background:var(--slg-zone); color:#fff;
}

/* 종류 키 — 배치도의 P(파랑) · R(주황) 라벨 */
#seosin-landscape-guide .slg-key{
  display:grid; place-items:center; min-width:1.75em; height:1.55em; padding:0 .3em;

}

#seosin-landscape-guide .slg-chip--relax .slg-key{ background:var(--slg-relax); }

/* ── 구역 패널 ────────────────────────────────────────────── */
#seosin-landscape-guide .slg-zone{

  animation:slg-zone-in .5s cubic-bezier(.2,.7,.3,1) both;
}
#seosin-landscape-guide .slg-zone::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:2px;
  background:linear-gradient(var(--slg-zone), rgba(195,34,44,.15));
}
#seosin-landscape-guide .slg-zone[hidden]{ display:none; }

#seosin-landscape-guide .slg-zone-head{
  display:flex; align-items:center; gap:2.6cqw;
  padding-bottom:3cqw; border-bottom:1px solid var(--slg-line);
}
#seosin-landscape-guide .slg-zone-mark{
  flex:0 0 auto; display:grid; place-items:center;
  width:clamp(46px,5.4cqw,68px); height:clamp(46px,5.4cqw,68px);
  border:2px solid #fff; border-radius:50%;
  background:var(--slg-zone); color:#fff;
  font-size:clamp(20px,2.6cqw,32px); font-weight:600; line-height:1;
}
#seosin-landscape-guide .slg-zone-heading{ min-width:0; }
#seosin-landscape-guide .slg-zone-title{
  display:block; font-size:clamp(17px,2.1cqw,27px); font-weight:400; letter-spacing:-.01em;
  color:var(--slg-ink);
}
#seosin-landscape-guide .slg-zone-sub{
  display:block; margin-top:.7em; font-size:clamp(11px,1.15cqw,14px);
  letter-spacing:.06em; color:var(--slg-zone-ink); word-break:keep-all;
}

#seosin-landscape-guide .slg-zone-grid{
  display:grid; gap:3cqw; margin-top:3.2cqw;
  grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
  align-items:start;
}

/* 영상 — 재생 · 시간바 · 전체화면만 노출하는 최소 플레이어 */
#seosin-landscape-guide .slg-video[hidden]{ display:none; }
#seosin-landscape-guide .slg-player{
  position:relative; width:100%; overflow:hidden;
  background:#000; border:1px solid var(--slg-line);
}
#seosin-landscape-guide .slg-video-frame{
  position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:#000;
}
#seosin-landscape-guide .slg-video-frame > div{
  position:absolute; inset:0; width:100%; height:100%; overflow:hidden;
}
#seosin-landscape-guide .slg-video-frame iframe{
  position:absolute; inset:0; width:100% !important; height:100% !important; max-width:100%;
  border:0; display:block;
  pointer-events:none;   /* 유튜브·비메오 자체 UI가 뜨지 않게 막습니다 */
}
/* 영상 자체가 전체화면일 때 — 화면 탭으로 재생/정지 할 수 있게 터치를 열어 둡니다 */
#seosin-landscape-guide .slg-video-frame iframe:fullscreen{ pointer-events:auto; background:#000; }
#seosin-landscape-guide .slg-video-frame iframe:-webkit-full-screen{ pointer-events:auto; background:#000; }
/* SDK를 못 불러온 경우에만 원래 플레이어로 되돌립니다 */
#seosin-landscape-guide .slg-player.is-native .slg-video-frame iframe{ pointer-events:auto; }
#seosin-landscape-guide .slg-player.is-native .slg-video-hit,
#seosin-landscape-guide .slg-player.is-native .slg-video-bar{ display:none; }

/* 화면 전체가 재생·정지 버튼 */
#seosin-landscape-guide .slg-video-hit{
  position:absolute; inset:0; z-index:2;

  padding:0; border:0; background:none; cursor:pointer;

}
#seosin-landscape-guide .slg-video-hit:focus-visible{ outline:1px solid var(--slg-gold); outline-offset:-3px; }
#seosin-landscape-guide .slg-video-hit-ico{
  display:grid; place-items:center;
  width:clamp(52px,6cqw,78px); height:clamp(52px,6cqw,78px);

  background:rgba(5,9,8,.34); color:#fff;
  transition:opacity .3s ease, transform .3s ease, background-color .25s ease, border-color .25s ease, color .25s ease;
}
#seosin-landscape-guide .slg-video-hit-ico svg{ width:36%; height:36%; fill:currentColor; margin-left:8%; }
#seosin-landscape-guide .slg-player.is-playing .slg-video-hit-ico{ opacity:0; transform:scale(.92); }

/* 컨트롤 바 */
#seosin-landscape-guide .slg-video-bar{
  position:absolute; left:0; right:0; bottom:0; z-index:3;
  display:flex; align-items:center; gap:clamp(8px,1.1cqw,16px);
  padding:clamp(10px,1.1cqw,16px) clamp(10px,1.4cqw,18px) clamp(8px,.9cqw,13px);
  background:linear-gradient(to top, rgba(5,9,8,.88), rgba(5,9,8,0));

  transition:none;          /* 마우스가 벗어나면 지연 없이 즉시 사라집니다 */
}
#seosin-landscape-guide .slg-player:focus-within .slg-video-bar{
  opacity:1; transform:none; pointer-events:auto;
  transition:opacity .2s ease, transform .2s ease;
}
/* 호버가 없는 터치 기기에서는 항상 노출 */
@media (hover:none){
  #seosin-landscape-guide .slg-video-bar{ opacity:1; transform:none; pointer-events:auto; }
}
#seosin-landscape-guide .slg-vbtn{
  flex:0 0 auto; display:grid; place-items:center;
  width:clamp(24px,2.2cqw,32px); height:clamp(24px,2.2cqw,32px);

  transition:color .2s ease;
}
#seosin-landscape-guide .slg-vbtn:focus-visible{ outline:1px solid var(--slg-gold); outline-offset:2px; }
#seosin-landscape-guide .slg-vico{ width:80%; height:80%; fill:currentColor; grid-area:1/1; }
#seosin-landscape-guide .slg-vico--pause{ display:none; }

#seosin-landscape-guide .slg-vfs{

  grid-area:1/1;
}
#seosin-landscape-guide .slg-vfs--out{ display:none; }
#seosin-landscape-guide .slg-player.is-fs .slg-vfs--in{ display:none; }
#seosin-landscape-guide .slg-player.is-fs .slg-vfs--out{ display:block; }

/* 터치 기기 — 컨트롤 버튼 터치 영역 44px 확보 */
@media (pointer:coarse){
  #seosin-landscape-guide .slg-video-bar{ gap:4px; padding:10px 4px 2px; }
  #seosin-landscape-guide .slg-vbtn{ width:44px; height:44px; }
  #seosin-landscape-guide .slg-vico{ width:52%; height:52%; }
  #seosin-landscape-guide .slg-vfs{ width:50%; height:50%; }
  #seosin-landscape-guide .slg-vseek{ height:28px; }
}
#seosin-landscape-guide .slg-vtime{
  flex:0 0 auto; font-size:clamp(10px,1.02cqw,12px); color:var(--slg-ink-2);
  font-variant-numeric:tabular-nums;
}
#seosin-landscape-guide .slg-vseek{ flex:1 1 auto; min-width:0; height:14px; }

/* 가상 전체화면 — 기기 전체화면이 전혀 불가능할 때만 쓰는 마지막 대안 */
#seosin-landscape-guide.slg-fs-lock{
  container-type:normal;   /* 일부 브라우저에서 fixed 기준점이 섹션으로 잡히는 것 방지 */
  overflow:visible;
}
#seosin-landscape-guide.slg-fs-lock .slg-zone{ animation:none; transform:none; }
#seosin-landscape-guide .slg-player.is-pseudo-fs{
  position:fixed; top:0; left:0; right:0; bottom:0; z-index:2147483000;
  width:100vw; height:100vh; height:100dvh; max-width:none;
  margin:0; border:0; background:#000;
  display:flex; align-items:center; justify-content:center;
  touch-action:none;       /* 전체화면 중 뒤 페이지 스크롤 차단 */
}
#seosin-landscape-guide .slg-player.is-pseudo-fs .slg-video-frame{
  width:min(100vw, calc(100vh * 16 / 9));
  width:min(100vw, calc(100dvh * 16 / 9));
  height:auto; aspect-ratio:16/9;
}
/* 가상 전체화면 컨트롤 — 노치·홈 인디케이터 피하기 */
#seosin-landscape-guide .slg-player.is-pseudo-fs .slg-video-bar{
  padding-left:max(12px, env(safe-area-inset-left));
  padding-right:max(12px, env(safe-area-inset-right));
  padding-bottom:max(8px, env(safe-area-inset-bottom));
}
#seosin-landscape-guide .slg-player.is-pseudo-fs .slg-vtime{ font-size:13px; }

#seosin-landscape-guide .slg-video-tools{
  display:flex; align-items:center; justify-content:space-between; gap:2cqw;
  margin-top:1.2cqw;
}
#seosin-landscape-guide .slg-video-label{
  font-size:clamp(10px,1.05cqw,12px); letter-spacing:.16em; color:var(--slg-ink-3);
}

/* 구역 사진 */
#seosin-landscape-guide .slg-shots{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.4cqw; margin-top:1.8cqw;
}
#seosin-landscape-guide .slg-shots[hidden]{ display:none; }
#seosin-landscape-guide .slg-shot{
  position:relative; margin:0; aspect-ratio:4/3; overflow:hidden;
  background:var(--slg-bg-2); border:1px solid var(--slg-line);
}
#seosin-landscape-guide .slg-shot img{
  width:100%; height:100%; object-fit:cover; display:block;
  transition:transform .8s cubic-bezier(.2,.7,.3,1);
}

/* 설명 */
#seosin-landscape-guide .slg-zone-text{ display:block; }
#seosin-landscape-guide .slg-zone-desc{
  margin:0; font-size:clamp(13px,1.28cqw,15px); line-height:1.95; color:var(--slg-ink-2);
  word-break:keep-all;
}

/* 재생 바 */
#seosin-landscape-guide .slg-seek{
  -webkit-appearance:none; appearance:none;
  display:block; width:100%; height:12px; margin:0; padding:0;
  background:transparent; cursor:pointer;
}
#seosin-landscape-guide .slg-seek:focus-visible{ outline:1px solid var(--slg-gold); outline-offset:4px; }
#seosin-landscape-guide .slg-seek::-webkit-slider-runnable-track{
  height:2px;
  background:
    linear-gradient(var(--slg-gold),var(--slg-gold)) 0 / var(--slg-p,0%) 100% no-repeat,
    var(--slg-line-2);
}
#seosin-landscape-guide .slg-seek::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:9px; height:9px; margin-top:-3.5px; border:0; border-radius:50%; background:var(--slg-gold);
}
#seosin-landscape-guide .slg-seek::-moz-range-track{ height:2px; background:var(--slg-line-2); }
#seosin-landscape-guide .slg-seek::-moz-range-progress{ height:2px; background:var(--slg-gold); }
#seosin-landscape-guide .slg-seek::-moz-range-thumb{
  width:9px; height:9px; border:0; border-radius:50%; background:var(--slg-gold);
}

/* ── 카운트 ───────────────────────────────────────────────── */
#seosin-landscape-guide .slg-count{
  margin:4cqw 0 1.6cqw; font-size:clamp(11px,1.1cqw,13px);
  letter-spacing:.12em; color:var(--slg-ink-3);
}
#seosin-landscape-guide .slg-count [data-count]{ color:var(--slg-ink-2); }

/* ── 시설 카드 ────────────────────────────────────────────── */
#seosin-landscape-guide .slg-grid{
  display:grid; gap:3cqw 2.4cqw;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));
}
#seosin-landscape-guide .slg-card{
  --slg-c:var(--slg-ink-2);
  display:flex; flex-direction:column; width:100%; padding:0; margin:0;
  border:0; background:none; color:inherit; font:inherit; text-align:left; cursor:pointer;
  -webkit-appearance:none; appearance:none;
  touch-action:manipulation;
}
/* 카드별 대표색 — 배치도와 동일 */
#seosin-landscape-guide .slg-card[data-cat="play"]{ --slg-c:var(--slg-play); }
#seosin-landscape-guide .slg-card[data-cat="relax"]{ --slg-c:var(--slg-relax); }
#seosin-landscape-guide .slg-card[hidden]{ display:none; }
#seosin-landscape-guide .slg-card:focus-visible{ outline:1px solid var(--slg-c); outline-offset:6px; }

#seosin-landscape-guide .slg-thumb{
  position:relative; aspect-ratio:4/3; margin:0; overflow:hidden;
  background:var(--slg-bg-2); display:grid; place-items:center;
}
#seosin-landscape-guide .slg-thumb::before{
  content:""; position:absolute; left:0; right:0; bottom:0; height:3px; z-index:1;
  background:var(--slg-c);
}
#seosin-landscape-guide .slg-thumb::after{
  content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 1px var(--slg-line);
  transition:box-shadow .3s ease; pointer-events:none;
}
#seosin-landscape-guide .slg-thumb img{
  width:100%; height:100%; object-fit:cover; display:block;
  transition:transform .8s cubic-bezier(.2,.7,.3,1);
}
#seosin-landscape-guide .slg-thumb-fallback{
  display:grid; place-items:center; gap:.9em; text-align:center;
}
#seosin-landscape-guide .slg-thumb-fallback b{
  font-size:clamp(20px,2.4cqw,30px); font-weight:300; letter-spacing:.06em; color:var(--slg-c);
}
#seosin-landscape-guide .slg-thumb-fallback span{
  font-size:clamp(10px,1.02cqw,12px); letter-spacing:.2em; color:var(--slg-ink-3); opacity:.7;
}
/* 코드 배지 — 배치도 마커 모양 그대로 */
#seosin-landscape-guide .slg-badge{
  position:absolute; top:10px; left:10px; z-index:2;

}
#seosin-landscape-guide .slg-more{
  position:absolute; right:0; bottom:3px; z-index:1;

}

#seosin-landscape-guide .slg-info{ padding:1.6cqw .2cqw 0; }
#seosin-landscape-guide .slg-cat{

}
#seosin-landscape-guide .slg-cat::before{
  content:""; width:.5em; height:.5em; border-radius:2px; background:currentColor;
}

  display:flex; align-items:center; gap:.5em; min-width:0;

}
/* 이름 옆 P/R 코드 — 배치도 마커와 같은 색 */
#seosin-landscape-guide .slg-name-code{
  flex:0 0 auto; display:inline-grid; place-items:center;
  min-width:2.3em; padding:.22em .45em; border-radius:5px;

  color:#fff; background:var(--slg-c);

}
#seosin-landscape-guide .slg-name-text{ min-width:0; word-break:keep-all; }
#seosin-landscape-guide .slg-sub{
  margin:.5em 0 0; font-size:clamp(11px,1.14cqw,13px); color:var(--slg-ink-3);
}
#seosin-landscape-guide .slg-where{
  margin:1.1em 0 0; padding-top:1.1em; border-top:1px solid var(--slg-line);

#seosin-landscape-guide .slg-empty{

#seosin-landscape-guide .slg-card.is-in{

  animation-delay:calc(var(--slg-i, 0) * 32ms);
}

/* ── 호버 효과는 마우스 기기에서만 ──────────────────────────
   터치 기기에서는 스크롤하다 손가락이 닿은 카드에 호버가 '붙어서'
   이미지가 확대되고 글자색이 바뀌며 화면이 밀리는 것처럼 보였습니다. */
@media (hover:hover) and (pointer:fine){
  #seosin-landscape-guide .slg-chip:hover{ color:var(--slg-ink-2); }
  #seosin-landscape-guide .slg-chip--play:hover{ color:var(--slg-play); }
  #seosin-landscape-guide .slg-chip--relax:hover{ color:var(--slg-relax); }
  #seosin-landscape-guide .slg-chip.is-on:hover{ color:var(--slg-ink); }
  #seosin-landscape-guide .slg-chip--play.is-on:hover{ color:var(--slg-play); }
  #seosin-landscape-guide .slg-chip--relax.is-on:hover{ color:var(--slg-relax); }

  #seosin-landscape-guide .slg-video-hit:hover .slg-video-hit-ico{
    background:var(--slg-gold); border-color:var(--slg-gold); color:#12180f;
  }
  #seosin-landscape-guide .slg-player:hover .slg-video-bar{
    opacity:1; transform:none; pointer-events:auto;
    transition:opacity .2s ease, transform .2s ease;   /* 나타날 때만 부드럽게 */
  }
  #seosin-landscape-guide .slg-vbtn:hover{ color:var(--slg-gold); }
  #seosin-landscape-guide .slg-shot:hover img{ transform:scale(1.05); }

  #seosin-landscape-guide .slg-card:hover .slg-thumb::after{ box-shadow:inset 0 0 0 1px var(--slg-c); }
  #seosin-landscape-guide .slg-card:hover .slg-thumb img{ transform:scale(1.06); }

  function clearVideo(){

  function nativeFallback(info, title){

    var url = info.kind === 'yt'

        '?rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&cc_load_policy=0&mute=0' +
        (info.start ? '&start=' + info.start : '')

        '?dnt=1&title=0&byline=0&portrait=0&pip=0&watch_full_video=0&muted=0' +

      try{

          host: 'https://www.youtube-nocookie.com',
          videoId: info.id,
          width: '100%', height: '100%',
          playerVars: {
            controls: 0, rel: 0, modestbranding: 1, playsinline: 1, disablekb: 1,
            fs: 1, mute: 0, iv_load_policy: 3, cc_load_policy: 0, start: info.start || 0

      if(panel.hidden || videoBox.hidden || vPlayerEl.classList.contains('is-native')) return;
      if(vSeen || (media && media.state.playing)) enterPseudo(true);
    } else if(fsMode === 'pseudo' && fsAuto){
      exitPseudo();
    }
  }
  if(mqLand){
    if(mqLand.addEventListener) mqLand.addEventListener('change', onOrient);
    else if(mqLand.addListener) mqLand.addListener(onOrient);
  }

  /* ── 구역 사진 ───────────────────────────────────────────── */
  function setShots(list, title){
    var arr = (list || []).filter(Boolean);
    if(!arr.length){ shotsBox.hidden = true; shotsBox.innerHTML = ''; return; }
    shotsBox.innerHTML = arr.map(function(src, i){
      return '<figure class="slg-shot"><img src="' + esc(src) + '" alt="' + esc(title + ' 전경 ' + (i + 1)) +
             '" loading="lazy" decoding="async"></figure>';
    }).join('');
    shotsBox.hidden = false;
  }

  /* ── 카드 렌더 ───────────────────────────────────────────── */
  grid.innerHTML = ITEMS.map(function(it, i){
    var thumb = it.img
      ? '<img src="' + esc(it.img) + '" alt="' + esc(it.name) + '" loading="lazy" decoding="async">'
      : '<span class="slg-thumb-fallback"><b>' + esc(it.code) + '</b><span>' + esc(CAT_LABEL[it.cat]) + '</span></span>';
    return ''
      + '<button type="button" class="slg-card" data-index="' + i + '"'
      +   ' data-cat="' + esc(it.cat) + '"'
      +   ' data-zones="' + esc(it.zones.join(' ')) + '"'
      +   ' aria-haspopup="dialog"'
      +   ' aria-label="' + esc(it.code + ' ' + it.name + ' — ' + it.sub + ' 설명 보기') + '">'
      +   '<figure class="slg-thumb">'
      +     '<span class="slg-badge">' + esc(it.code) + '</span>' + thumb
      +     '<span class="slg-more">설명 보기</span>'
      +   '</figure>'
      +   '<div class="slg-info">'
      +     '<p class="slg-cat">' + esc(CAT_LABEL[it.cat]) + '</p>'
      +     '<h3 class="slg-name"><span class="slg-name-code" aria-hidden="true">' + esc(it.code) + '</span>'
      +       '<span class="slg-name-text">' + esc(it.name) + '</span></h3>'
      +     '<p class="slg-sub">' + esc(it.sub) + '</p>'
      +     '<p class="slg-where">' + esc(it.where) + '</p>'
      +   '</div>'
      + '</button>';
  }).join('');

  var cards = Array.prototype.slice.call(grid.querySelectorAll('.slg-card'));

  /* ── 시설 상세 팝업 ──────────────────────────────────────── */
  var modal     = root.querySelector('#slg-modal');
  var modalIn   = modal.querySelector('.slg-modal-inner');
  var mFig      = modal.querySelector('[data-modal-fig]');
  var mCode     = modal.querySelector('[data-modal-code]');
  var mCat      = modal.querySelector('[data-modal-cat]');
  var mName     = modal.querySelector('[data-modal-name]');
  var mSub      = modal.querySelector('[data-modal-sub]');
  var mDesc     = modal.querySelector('[data-modal-desc]');
  var mWhere    = modal.querySelector('[data-modal-where]');
  var mZone     = modal.querySelector('[data-modal-zone]');
  var mPrev     = modal.querySelector('[data-modal-prev]');
  var mNext     = modal.querySelector('[data-modal-next]');
  var mPos      = modal.querySelector('[data-modal-pos]');
  var mTotal    = modal.querySelector('[data-modal-total]');

  var canDialog = typeof modal.showModal === 'function';
  var lastFocus = null;
  var openIdx   = -1;

  var CLOSE_MS  = 280;     /* 닫힘 애니메이션 시간 — CSS .is-closing 과 맞춥니다 */
  var closing   = false;
  var closeT    = null;

  /* ── 팝업 동안 뒤 페이지 고정 ──────────────────────────────
     iOS는 body overflow:hidden 만으로는 뒤 페이지가 계속 스크롤되고,
     닫을 때 맨 위로 튀는 문제가 있어 position:fixed 방식으로 고정 후
     닫을 때 원래 위치로 되돌립니다. */
  var lockY = 0, locked = false;
  function lockScroll(){
    if(locked) return;
    locked = true;
    lockY = window.pageYOffset || document.documentElement.scrollTop || 0;
    var b = document.body.style;
    b.position = 'fixed';
    b.top = (-lockY) + 'px';
    b.left = '0';
    b.right = '0';
    b.width = '100%';
    b.overflow = 'hidden';
  }
  function unlockScroll(){
    if(!locked) return;
    locked = false;
    var b = document.body.style;
    b.position = ''; b.top = ''; b.left = ''; b.right = ''; b.width = ''; b.overflow = '';
    var html = document.documentElement;
    var prevSB = html.style.scrollBehavior;
    html.style.scrollBehavior = 'auto';   /* 부드러운 스크롤 설정이 있어도 즉시 복귀 */
    window.scrollTo(0, lockY);
    html.style.scrollBehavior = prevSB;
  }

  function visibleIndexes(){
    var out = [];
    cards.forEach(function(card){
      if(!card.hidden) out.push(Number(card.getAttribute('data-index')));
    });
    return out;
  }

  function zoneNames(list){
    return (list || []).map(function(z){
      return ZONES[z] ? ZONES[z].title : z;
    }).join(' · ');
  }

  function fillModal(idx){
    var it = ITEMS[idx];
    if(!it) return;

    modalIn.setAttribute('data-cat', it.cat);
    mFig.innerHTML = it.img
      ? '<img src="' + esc(it.img) + '" alt="' + esc(it.name) + '" decoding="async">'
      : '<span class="slg-thumb-fallback"><b>' + esc(it.code) + '</b><span>' + esc(CAT_LABEL[it.cat]) + '</span></span>';

    mCode.textContent  = it.code;
    mCat.textContent   = CAT_LABEL[it.cat];
    mName.textContent  = it.name;
    mSub.textContent   = it.sub;
    mDesc.textContent  = it.desc || '';
    mWhere.textContent = it.where;
    mZone.textContent  = zoneNames(it.zones);

    var list = visibleIndexes();
    var at = list.indexOf(idx);
    mTotal.textContent = String(list.length);
    mPos.textContent   = String(at < 0 ? 1 : at + 1);
    var solo = list.length < 2;
    mPrev.disabled = solo;
    mNext.disabled = solo;

    openIdx = idx;
  }

  function isOpen(){ return canDialog ? modal.open : modal.hasAttribute('open'); }

  function openModal(idx){
    /* 닫히는 도중에 다시 열면 닫힘을 취소하고 내용만 바꿉니다 */
    if(closing){
      clearTimeout(closeT); closeT = null;
      closing = false;
      modal.classList.remove('is-closing');
      fillModal(idx);
      modal.scrollTop = 0;
      return;
    }
    lastFocus = document.activeElement;
    fillModal(idx);
    lockScroll();
    if(canDialog){ modal.showModal(); }
    else { modal.classList.add('is-fallback'); modal.setAttribute('open', ''); }
    modal.scrollTop = 0;
    focusNoScroll(modal.querySelector('[data-modal-close]'));
  }

  /* 부드럽게 닫기 — 페이드아웃이 끝난 뒤 실제로 닫습니다 */
  function closeModal(){
    if(closing || !isOpen()) return;
    closing = true;
    modal.classList.add('is-closing');
    var ms = mq('(prefers-reduced-motion: reduce)') ? 0 : CLOSE_MS;
    closeT = setTimeout(finishClose, ms);
  }

  function finishClose(){
    closeT = null;
    closing = false;
    if(canDialog){
      if(modal.open) modal.close();      /* close 이벤트 → afterClose */
      modal.classList.remove('is-closing');
    } else {
      modal.removeAttribute('open');
      modal.classList.remove('is-fallback', 'is-closing');
      afterClose();
    }
  }

  function afterClose(){
    unlockScroll();
    openIdx = -1;
    focusNoScroll(lastFocus);   /* 카드로 포커스를 돌려도 화면은 움직이지 않습니다 */
    lastFocus = null;
  }

  function step(dir){
    var list = visibleIndexes();
    if(list.length < 2) return;
    var at = list.indexOf(openIdx);
    if(at < 0) at = 0;
    var next = (at + dir + list.length) % list.length;
    fillModal(list[next]);
    modal.scrollTop = 0;
  }

  modal.addEventListener('close', afterClose);

  /* Esc 키 — 즉시 닫히지 않고 같은 애니메이션으로 닫히게 */
  modal.addEventListener('cancel', function(e){
    e.preventDefault();
    closeModal();
  });

  /* 배경(백드롭) 클릭으로 닫기 */
  modal.addEventListener('click', function(e){
    if(e.target === modal) closeModal();
  });

  modal.querySelector('[data-modal-close]').addEventListener('click', closeModal);
  mPrev.addEventListener('click', function(){ step(-1); });
  mNext.addEventListener('click', function(){ step(1); });

  document.addEventListener('keydown', function(e){
    if(openIdx < 0 || closing) return;
    if(e.key === 'ArrowLeft'){ e.preventDefault(); step(-1); }
    else if(e.key === 'ArrowRight'){ e.preventDefault(); step(1); }
    else if(e.key === 'Escape' && !canDialog){ e.preventDefault(); closeModal(); }
  });

  /* 카드 클릭 → 팝업 */
  grid.addEventListener('click', function(e){
    var card = e.target.closest('.slg-card');
    if(!card || !grid.contains(card)) return;
    openModal(Number(card.getAttribute('data-index')));
  });

  /* ── 필터 적용 ───────────────────────────────────────────── */
  function apply(){
    var shown = [];

    cards.forEach(function(card){
      var zoneOk = state.zone === 'all' ||
                   card.getAttribute('data-zones').split(' ').indexOf(state.zone) > -1;
      var catOk  = state.cat === 'all' || card.getAttribute('data-cat') === state.cat;
      var ok = zoneOk && catOk;
      card.hidden = !ok;
      card.classList.remove('is-in');
      if(ok) shown.push(card);
    });

    empty.hidden = shown.length > 0;
    if(countN) countN.textContent = String(shown.length);

    /* 사용자가 필터를 바꿨을 때만 카드가 다시 등장합니다 */
    if(booted && shown.length){
      void grid.offsetWidth; /* 애니메이션 재시작 */
      shown.forEach(function(card, i){
        card.style.setProperty('--slg-i', i);
        card.classList.add('is-in');
      });
    }
  }

  function showZone(){
    var z = ZONES[state.zone];

    if(!z){
      panel.hidden = true;
      setVideo('', '');       /* 영상 정지 */
      setShots([], '');
      return;
    }

    panel.querySelector('[data-zone-mark]').textContent  = state.zone === 'etc' ? '·' : state.zone;
    panel.querySelector('[data-zone-title]').textContent = z.title;
    panel.querySelector('[data-zone-sub]').textContent   = z.sub;
    panel.querySelector('[data-zone-desc]').textContent  = z.desc;

    setVideo(z.video, z.title);
    setShots(z.shots, z.title);

    panel.hidden = false;
  }

  /* ── 칩 클릭 ─────────────────────────────────────────────── */
  root.querySelectorAll('.slg-chips').forEach(function(group){
    var key = group.getAttribute('data-filter');
    group.addEventListener('click', function(e){
      var btn = e.target.closest('.slg-chip');
      if(!btn || !group.contains(btn)) return;
      group.querySelectorAll('.slg-chip').forEach(function(b){
        var on = b === btn;
        b.classList.toggle('is-on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
      state[key] = btn.getAttribute('data-value');
      if(key === 'zone') showZone();
      apply();
      if(openIdx > -1) closeModal(); /* 필터가 바뀌면 팝업은 닫습니다 */
    });
  });

  showZone();
  apply();
  booted = true;
})();
</script>
</section>
